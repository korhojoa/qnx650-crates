[package]
name = "hidkbm-ring"
version = "0.2.3"
edition = "2021"
description = "Shared-memory keyboard, mouse and touch rings with PPS notifications."
license = "Apache-2.0"

# The shm feature supplies shared-memory producers and readers.
# Without shm, the layout and PPS wake interface have no dependencies.

[lib]
path = "src/lib.rs"

[features]
# Producer, Reader and wait_any (shared memory and poll).
# Without it: the layout's constants, Event, the PPS paths and Wake only.
default = ["shm"]
shm = ["dep:qnx-shm"]

[dependencies]
qnx-shm = { path = "../qnx-shm", optional = true }
